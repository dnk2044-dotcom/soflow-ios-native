name: SOFLOW
options:
  bundleIdPrefix: com.dean.soflow
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: NO

packages:
  SOFLOWCore:
    path: .

targets:
  SOFLOW:
    type: application
    platform: iOS
    sources:
      - path: Sources/SOFLOWApp
        excludes:
          - Info.plist
    info:
      path: Sources/SOFLOWApp/Info.plist
    dependencies:
      - package: SOFLOWCore
        product: SOFLOWCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dean.soflow
        PRODUCT_NAME: SOFLOW
        INFOPLIST_FILE: Sources/SOFLOWApp/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
